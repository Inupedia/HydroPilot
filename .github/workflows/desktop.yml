name: Desktop

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/hydropilot-core/**'
      - 'data/demo/**'
      - 'scripts/stage_desktop_api.py'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build API sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/hydropilot-core -e apps/api pyinstaller
          pyinstaller --clean --noconfirm --onefile --name hydropilot-api --paths apps/api/src --paths packages/hydropilot-core/src apps/api/desktop_entry.py
          python scripts/stage_desktop_api.py
      - name: Install renderer
        run: npm --prefix apps/web install
      - name: Install desktop shell
        run: npm --prefix apps/desktop install
      - name: Build Linux unpacked desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix apps/desktop run pack
      - name: Verify packaged resources
        run: |
          test -f apps/desktop/release/linux-unpacked/resources/web/index.html
          test -x apps/desktop/release/linux-unpacked/resources/api/hydropilot-api
          test -f apps/desktop/release/linux-unpacked/resources/data/demo/sacramento_v0_1.json
      - name: Launch packaged Electron and verify Cesium
        run: |
          xvfb-run -a env HYDROPILOT_DESKTOP_SMOKE=1 apps/desktop/release/linux-unpacked/hydropilot

  package-desktop:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
            artifact: macos
          - os: windows-latest
            target: --win
            artifact: windows
          - os: ubuntu-latest
            target: --linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build API sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/hydropilot-core -e apps/api pyinstaller
          pyinstaller --clean --noconfirm --onefile --name hydropilot-api --paths apps/api/src --paths packages/hydropilot-core/src apps/api/desktop_entry.py
          python scripts/stage_desktop_api.py
      - name: Install renderer
        run: npm --prefix apps/web install
      - name: Install desktop shell
        run: npm --prefix apps/desktop install
      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix apps/desktop run dist -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: hydropilot-desktop-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error
