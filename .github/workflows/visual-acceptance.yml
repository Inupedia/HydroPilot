name: Cesium Visual Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'data/demo/**'
      - '.github/workflows/visual-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'data/demo/**'
      - '.github/workflows/visual-acceptance.yml'

permissions:
  contents: read

jobs:
  cesium-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/hydropilot-core -e apps/api

      - name: Start API
        run: |
          nohup env PYTHONPATH=apps/api/src:packages/hydropilot-core/src \
            python -m uvicorn hydropilot_api.main:app --host 127.0.0.1 --port 8000 \
            >/tmp/hydropilot-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend
        working-directory: apps/web
        run: npm install

      - name: Verify Vite dev serves decodable Cesium imagery
        run: |
          npm --prefix apps/web run dev -- --host 127.0.0.1 --port 5173 >/tmp/hydropilot-vite-dev.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -D /tmp/naturalearth.headers \
            http://127.0.0.1:5173/cesium/Assets/Textures/NaturalEarthII/0/0/0.jpg \
            -o /tmp/naturalearth.jpg
          grep -qi '^content-type: image/jpeg' /tmp/naturalearth.headers
          python - <<'PY'
          from pathlib import Path
          data = Path('/tmp/naturalearth.jpg').read_bytes()
          assert len(data) > 1000, len(data)
          assert data[:2] == b'\xff\xd8', data[:16]
          assert data[-2:] == b'\xff\xd9', data[-16:]
          PY

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Test and build frontend
        working-directory: apps/web
        run: |
          npm test -- --run
          npm run build
          test -f dist/cesium/Assets/Textures/NaturalEarthII/0/0/0.jpg
          test -d dist/cesium/Workers

      - name: Start built frontend
        run: |
          nohup npm --prefix apps/web run preview -- --host 127.0.0.1 --port 4173 \
            >/tmp/hydropilot-web.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 >/dev/null

      - name: Capture real Cesium runtime
        working-directory: apps/web
        env:
          HYDROPILOT_WEB_URL: http://127.0.0.1:4173
          SCREENSHOT_PATH: ${{ github.workspace }}/artifacts/hydropilot-cesium.png
        run: node scripts/capture.mjs

      - name: Upload acceptance screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hydropilot-cesium-acceptance
          path: artifacts/hydropilot-cesium.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydropilot-visual-logs
          path: |
            /tmp/hydropilot-api.log
            /tmp/hydropilot-web.log
            /tmp/hydropilot-vite-dev.log
          if-no-files-found: warn
          retention-days: 7
