name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/hydropilot-core -e apps/api pytest httpx
      - name: Verify
        run: |
          make verify
          python -m py_compile scripts/setup_dev.py scripts/dev_studio.py scripts/build_tauri_sidecar.py

  compose-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config

  react-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate root scripts
        run: |
          node -e "const p=require('./package.json'); if(!p.scripts?.dev || !p.scripts?.['dev:web'] || !p.scripts?.build) process.exit(1)"
          node --check scripts/run_python.mjs
      - name: Install
        working-directory: apps/studio
        run: npm install
      - name: Test
        working-directory: apps/studio
        run: npm test
      - name: Build
        working-directory: apps/studio
        run: npm run build:web
      - name: Verify Cesium assets
        run: |
          test -f apps/studio/dist/cesium/Assets/Textures/NaturalEarthII/0/0/0.jpg
          test -d apps/studio/dist/cesium/Workers
