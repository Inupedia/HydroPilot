name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/hydropilot-core -e apps/api pytest httpx
      - name: Verify
        run: make verify

  compose-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: cd apps/web && npm install
      - name: Test
        run: cd apps/web && npm test -- --run
      - name: Build
        run: cd apps/web && npm run build
