name: React Tauri Migration

on:
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'apps/api/**'
      - 'packages/hydropilot-core/**'
      - 'scripts/dev_studio.py'
      - 'scripts/build_tauri_sidecar.py'
      - '.github/workflows/react-tauri.yml'
  workflow_dispatch:

jobs:
  react-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React studio
        working-directory: apps/studio
        run: npm install
      - name: Test React studio
        working-directory: apps/studio
        run: npm test
      - name: Build React studio
        working-directory: apps/studio
        run: npm run build:web
      - name: Verify Cesium runtime assets
        run: |
          test -f apps/studio/dist/cesium/Assets/Textures/NaturalEarthII/0/0/0.jpg
          test -d apps/studio/dist/cesium/Workers

  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -e packages/hydropilot-core -e apps/api
      - name: Start API
        run: |
          nohup env PYTHONPATH=apps/api/src:packages/hydropilot-core/src python -m uvicorn hydropilot_api.main:app --host 127.0.0.1 --port 8000 >/tmp/hydropilot-api.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8000/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install studio and Chromium
        working-directory: apps/studio
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Build and start React preview
        run: |
          npm --prefix apps/studio run build:web
          nohup npm --prefix apps/studio run preview >/tmp/hydropilot-studio.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
      - name: Capture React Cesium runtime
        working-directory: apps/studio
        env:
          HYDROPILOT_WEB_URL: http://127.0.0.1:4173
          SCREENSHOT_PATH: ${{ github.workspace }}/artifacts/hydropilot-react-tauri.png
        run: node scripts/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hydropilot-react-tauri-acceptance
          path: artifacts/hydropilot-react-tauri.png
          if-no-files-found: error

  tauri-build-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and sidecar build tools
        run: python -m pip install -e packages/hydropilot-core -e apps/api pyinstaller
      - name: Install React studio
        working-directory: apps/studio
        run: npm install
      - name: Build target-specific API sidecar
        working-directory: apps/studio
        run: npm run sidecar
      - name: Check Tauri Rust application
        working-directory: apps/studio/src-tauri
        run: cargo check --locked || cargo check
      - name: Build unpackaged Tauri application
        working-directory: apps/studio
        run: npm run tauri -- build --debug --no-bundle
