name: SFINCS Tiny Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

jobs:
  tiny-regression:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core
        run: python -m pip install -e packages/hydropilot-core
      - name: Run tiny metric regression
        run: PYTHONPATH=packages/hydropilot-core/src python scripts/run_sfincs_regression.py | tee sfincs-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: sfincs-tiny-metrics
          path: sfincs-metrics.json
