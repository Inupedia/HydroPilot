name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: Resolve v0.3+ release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.meta.outputs.release_id }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./apps/studio/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$APP_VERSION" ]]; then
              echo "Tag $TAG does not match apps/studio version $APP_VERSION" >&2
              exit 1
            fi
          else
            VERSION="$APP_VERSION"
            TAG="v${VERSION}"
          fi

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null || true)"
          if [[ -n "$RELEASE_JSON" ]]; then
            RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
            IS_DRAFT="$(jq -r '.draft' <<<"$RELEASE_JSON")"
            if [[ "$IS_DRAFT" == "true" ]]; then
              SHOULD_RELEASE=true
              echo "Reusing draft release $TAG ($RELEASE_ID)."
            else
              SHOULD_RELEASE=false
              echo "Release $TAG is already published; skipping native rebuild."
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --generate-notes --title "HydroPilot $TAG"
            RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
            RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
            SHOULD_RELEASE=true
            echo "Created draft release $TAG ($RELEASE_ID)."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  build-native:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            bundles: dmg
          - name: macOS Intel
            os: macos-15-intel
            bundles: dmg
          - name: Windows x64
            os: windows-latest
            bundles: nsis
          - name: Linux x64
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsecret-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and sidecar build tools
        run: python -m pip install -e packages/hydropilot-core -e apps/api pyinstaller
      - name: Install React studio
        working-directory: apps/studio
        run: npm install
      - name: Build target-specific API sidecar
        working-directory: apps/studio
        run: npm run sidecar
      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/studio
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: false
          retryAttempts: 2
          releaseAssetNamePattern: 'HydroPilot_[version]_[platform]_[arch]_[bundle][ext]'
          args: '--bundles ${{ matrix.bundles }}'

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-native]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after every native build succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
          echo "Published $RELEASE_TAG with native Tauri assets."
