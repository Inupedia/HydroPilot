name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hydropilot-native-release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./apps/studio/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$APP_VERSION" ]]; then
              echo "Tag $TAG does not match apps/studio version $APP_VERSION" >&2
              exit 1
            fi
          else
            VERSION="$APP_VERSION"
            TAG="v${VERSION}"
          fi

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null || true)"
          if [[ -n "$RELEASE_JSON" ]]; then
            IS_DRAFT="$(jq -r '.draft' <<<"$RELEASE_JSON")"
            if [[ "$IS_DRAFT" == "true" ]]; then
              echo "Removing stale draft release $TAG from the previous release workflow."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
              SHOULD_RELEASE=true
            else
              SHOULD_RELEASE=false
              echo "Release $TAG is already published; skipping native rebuild."
            fi
          else
            SHOULD_RELEASE=true
            echo "Release $TAG is missing; native packages will be built before any tag or release is created."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  build-native:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            bundles: dmg
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
            bundles: dmg
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            bundles: nsis
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsecret-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and sidecar build tools
        run: python -m pip install -e packages/hydropilot-core -e apps/api pyinstaller
      - name: Install React studio
        working-directory: apps/studio
        run: npm install
      - name: Generate native icon set
        working-directory: apps/studio
        run: npm run icons
      - name: Build target-specific API sidecar
        working-directory: apps/studio
        run: npm run sidecar
      - name: Build Tauri bundle
        working-directory: apps/studio
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Collect distributable package
        shell: bash
        run: |
          mkdir -p release-assets
          find apps/studio/src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp '{}' release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: hydropilot-${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-native]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hydropilot-*
          path: release-assets
          merge-multiple: true
      - name: Create tag and publish release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -d '' ASSETS < <(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          if (( ${#ASSETS[@]} == 0 )); then
            echo "No distributable assets were downloaded." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --repo "$GH_REPO" \
            --target "$RELEASE_TARGET" \
            --generate-notes \
            --title "HydroPilot $RELEASE_TAG"
          echo "Published $RELEASE_TAG only after every native package completed successfully."
