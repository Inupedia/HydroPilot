name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Resolve version and release state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="$(node -p "require('./apps/desktop/package.json').version")"
            TAG="v${VERSION}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            SHOULD_RELEASE=false
            echo "Release $TAG already exists; skipping package publication."
          else
            SHOULD_RELEASE=true
            echo "Release $TAG is missing; native desktop packages will be published."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build ${{ matrix.name }} desktop
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set package version
        working-directory: apps/desktop
        run: npm version "${{ needs.prepare-release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build API sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/hydropilot-core -e apps/api pyinstaller
          pyinstaller --clean --noconfirm --onefile --name hydropilot-api --paths apps/api/src --paths packages/hydropilot-core/src apps/api/desktop_entry.py
          python scripts/stage_desktop_api.py

      - name: Install renderer
        working-directory: apps/web
        run: npm install

      - name: Install desktop shell
        working-directory: apps/desktop
        run: npm install

      - name: Build installers
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Remove unpacked directories
        shell: bash
        run: |
          rm -rf apps/desktop/release/*-unpacked
          rm -rf apps/desktop/release/mac apps/desktop/release/mac-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: hydropilot-desktop-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-desktop]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hydropilot-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_TARGET" \
              --generate-notes \
              --title "HydroPilot $RELEASE_TAG"
          fi
