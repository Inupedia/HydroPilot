name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.name }} desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set package version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix apps/desktop version "$VERSION" --no-git-tag-version

      - name: Build API sidecar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/hydropilot-core -e apps/api pyinstaller
          pyinstaller --clean --noconfirm --onefile --name hydropilot-api --paths apps/api/src --paths packages/hydropilot-core/src apps/api/desktop_entry.py
          python scripts/stage_desktop_api.py

      - name: Install renderer
        run: npm --prefix apps/web install

      - name: Install desktop shell
        run: npm --prefix apps/desktop install

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix apps/desktop run dist

      - name: Remove unpacked directories
        shell: bash
        run: |
          rm -rf apps/desktop/release/*-unpacked
          rm -rf apps/desktop/release/mac apps/desktop/release/mac-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: hydropilot-desktop-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hydropilot-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "HydroPilot $GITHUB_REF_NAME"
